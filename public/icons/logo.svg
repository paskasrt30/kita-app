<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F76FA6"/>
      <stop offset="55%" stop-color="#FFA98F"/>
      <stop offset="100%" stop-color="#D9A066"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- telinga anjing (floppy ears) di belakang atap -->
  <ellipse cx="112" cy="196" rx="33" ry="58" transform="rotate(-27 112 196)" fill="#D9A066"/>
  <ellipse cx="118" cy="200" rx="17" ry="36" transform="rotate(-27 118 200)" fill="#FFD6E4"/>
  <ellipse cx="400" cy="196" rx="33" ry="58" transform="rotate(27 400 196)" fill="#D9A066"/>
  <ellipse cx="394" cy="200" rx="17" ry="36" transform="rotate(27 394 200)" fill="#FFD6E4"/>

  <!-- roof -->
  <path d="M256 96 L406 218 L370 218 L370 240 L142 240 L142 218 L106 218 Z" fill="#FFFFFF"/>

  <!-- house body -->
  <rect x="142" y="240" width="228" height="176" rx="14" fill="#FFFFFF"/>

  <!-- roof ridge accent -->
  <rect x="142" y="236" width="228" height="10" fill="#F76FA6"/>

  <!-- tapak kaki anjing (paw print) di atap, menggantikan cerobong -->
  <g transform="translate(256,180)" fill="#F76FA6">
    <ellipse cx="0" cy="15" rx="14" ry="11.5"/>
    <circle cx="-20" cy="-7" r="7.4"/>
    <circle cx="-7" cy="-19" r="7.8"/>
    <circle cx="9" cy="-19" r="7.8"/>
    <circle cx="22" cy="-7" r="7.4"/>
  </g>

  <!-- CP monogram -->
  <text x="256" y="356" font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="118" fill="#B5734A" text-anchor="middle" letter-spacing="-2">CP</text>
</svg>
